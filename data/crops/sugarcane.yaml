# =============================================================================
# Sugarcane — agronomic reference data
# =============================================================================
# Sourcing tags: [FAO56] FAO Irrigation & Drainage Paper 56 (Allen et al. 1998)
#                [SHC]   Soil Health Card fertility classes (Govt. of India)
#                [ICAR]  ICAR / state agri-university package of practices
#                [REVIEW] working value from published ranges, not primary-verified
#
# ⚠️ YIELD UNITS: yield here is **millable cane**, not grain and not sugar. Typical
#    Indian yields are 70-100 t/ha — roughly 16x a wheat grain yield — so uptake per
#    tonne is correspondingly small (~1.3 kg N/t against wheat's 26). Reading these
#    per-tonne figures as if they were cereal figures would understate the nitrogen
#    dose by more than an order of magnitude.
#
# ⚠️ SEASON LENGTH: this is a ~12-month crop (360 days below). Two consequences:
#    - The weather archive must be replayed across a full year, which exceeds the
#      forecast endpoint's 92-day `past_days` window, so `src/weather.py` supplements
#      from the archive endpoint. Expect slower first loads.
#    - Nitrogen is split four ways across the first 120 days; nothing is applied in
#      the long grand-growth phase after that.
# =============================================================================

crop: sugarcane
display_name:
  en: Sugarcane
  hi: गन्ना
category: cash crop
season: annual                  # Feb-Mar or Oct-Nov planting, ~12 month cycle

water:
  # [FAO56] Table 12, Sugarcane. Kc_end 0.75 for a crop harvested green; lower if
  # allowed to dry/ripen. [REVIEW]
  kc:
    initial: 0.40
    mid: 1.25                   # highest Kc of the five — a tall, dense canopy
    end: 0.75

  # [FAO56] Table 11 lists 35/60/190/120 for virgin cane, which exceeds 12 months.
  # Compressed to a 360-day Indian cycle below. [REVIEW]
  stages:
    - name: initial             # germination / sprouting
      days: 30
    - name: development         # tillering
      days: 60
    - name: mid                 # grand growth — the bulk of cane formation
      days: 180
    - name: late                # ripening / maturation
      days: 90

  # [FAO56] Table 22, Sugarcane: 1.2-2.0 m. 1.50 m taken.
  root_depth_m:
    initial: 0.20
    max: 1.50

  depletion_fraction_p: 0.65    # [FAO56] Table 22

  yield_response_ky: 1.20       # [FAO56] / FAO-33

  application_efficiency:
    surface: 0.55               # long-duration furrow irrigation loses more
    sprinkler: 0.75
    drip: 0.90                  # sub-surface drip is increasingly standard

  # [ICAR] The grand-growth phase is when water shortage costs the most tonnage.
  critical_stages: [mid]

nutrients:
  yield_basis: millable cane

  # Total uptake per tonne of MILLABLE CANE. Ranges: N 1.0-1.5, P2O5 0.5-0.8,
  # K2O 1.5-2.5 kg/t. Note how small these are relative to cereals — yields are
  # 15-20x larger. [ICAR] [REVIEW]
  uptake_per_tonne_grain:
    N: 1.3
    P2O5: 0.6
    K2O: 2.0

  use_efficiency:
    N: 0.40
    P2O5: 0.20
    K2O: 0.60

  # [ICAR] Four splits through the first 120 days, the last coinciding with earthing
  # up. Nothing is applied during grand growth. P fully basal; K split. [REVIEW]
  splits:
    - stage: basal              # at planting
      day: 0
      fraction: {N: 0.25, P2O5: 1.00, K2O: 0.50}
    - stage: development        # ~45 days
      day: 45
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}
    - stage: development        # ~90 days
      day: 90
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.50}
    - stage: mid                # earthing up, ~120 days
      day: 120
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}

  attainable_yield_t_ha:
    rainfed: 50.0
    irrigated: 85.0

  # [ICAR] 250:115:115 is a standard irrigated sugarcane package. The mechanistic
  # cross-check happens to agree closely here (80 t/ha x 1.3 / 0.40 ~= 260 kg N),
  # unlike the cereals — a useful sanity signal that the per-tonne figures are sound.
  reference_dose_kg_ha:
    N: 250
    P2O5: 115
    K2O: 115
    at_yield_t_ha: 80.0

  fertility_adjustment:
    low: 1.25
    medium: 1.00
    high: 0.75

  cross_check_tolerance: 0.60

soil_fertility_classes:
  available_N_kg_ha:
    low: [0, 280]
    medium: [280, 560]
    high: [560, 2000]
  available_P2O5_kg_ha:
    low: [0, 10]
    medium: [10, 25]
    high: [25, 200]
  available_K2O_kg_ha:
    low: [0, 108]
    medium: [108, 280]
    high: [280, 1000]

mineralisation_fraction: 0.02

limits:
  ph:
    optimal: [6.0, 7.5]
    tolerable: [5.0, 8.5]

  temperature_c:
    optimal: [20.0, 35.0]
    heat_stress_above: 40.0
    cold_stress_below: 10.0
    heat_stress_critical_stage: mid

  # More tolerant of wet feet than the cereals, but not a paddy crop.
  waterlogging_tolerance_days: 7
