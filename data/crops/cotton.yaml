# =============================================================================
# Cotton — agronomic reference data
# =============================================================================
# Sourcing tags: [FAO56] FAO Irrigation & Drainage Paper 56 (Allen et al. 1998)
#                [SHC]   Soil Health Card fertility classes (Govt. of India)
#                [ICAR]  ICAR / state agri-university package of practices
#                [REVIEW] working value from published ranges, not primary-verified
#
# ⚠️ YIELD UNITS: cotton yield here is **seed cotton** (kapas — lint plus seed, as
#    sold), NOT lint and NOT grain. Typical Indian yields are 1.5-2.5 t/ha of seed
#    cotton, an order of magnitude below cereal grain yields, while uptake per tonne
#    is correspondingly higher. Mixing seed cotton with lint yield (~1/3 of it) would
#    understate the dose threefold.
#
# Cotton is the most drought-tolerant crop in this set (p = 0.65) and the longest in
# the field (~195 days), which is why nitrogen is split four ways.
# =============================================================================

crop: cotton
display_name:
  en: Cotton
  hi: कपास
category: fibre
season: kharif                  # May-Jun sowing, Nov-Jan picking

water:
  # [FAO56] Table 12, Cotton. Kc_end 0.70 with green foliage at harvest, 0.50 after
  # defoliation/senescence. 0.60 taken. [REVIEW]
  kc:
    initial: 0.35
    mid: 1.15
    end: 0.60

  # [FAO56] Table 11, Cotton: 30 / 50 / 60 / 55 = 195 days.
  stages:
    - name: initial             # sowing -> establishment
      days: 30
    - name: development         # vegetative -> squaring
      days: 50
    - name: mid                 # flowering -> boll development
      days: 60
    - name: late                # boll maturation -> picking
      days: 55

  # [FAO56] Table 22, Cotton: 1.0-1.7 m. 1.30 m taken. Deep roots are part of why
  # cotton copes with dry spells better than the cereals here.
  root_depth_m:
    initial: 0.15
    max: 1.30

  depletion_fraction_p: 0.65    # [FAO56] Table 22 — highest of the five crops

  yield_response_ky: 0.85       # [FAO56] / FAO-33 — least sensitive of the five

  application_efficiency:
    surface: 0.60
    sprinkler: 0.75
    drip: 0.90                  # cotton is a major drip-irrigation crop in India

  # [ICAR] Flowering and boll development is the yield-determining window.
  critical_stages: [mid]

nutrients:
  yield_basis: seed cotton

  # Total uptake per tonne of SEED COTTON — much higher per tonne than cereals
  # because yields are far lower. Ranges: N 50-60, P2O5 20-25, K2O 50-60 kg/t.
  # [ICAR] [REVIEW]
  uptake_per_tonne_grain:
    N: 55.0
    P2O5: 22.0
    K2O: 55.0

  use_efficiency:
    N: 0.40
    P2O5: 0.20
    K2O: 0.55

  # [ICAR] A long indeterminate season needs more splits than a cereal: cotton keeps
  # setting bolls, so nitrogen is fed through flowering. P and K fully basal. [REVIEW]
  splits:
    - stage: basal
      day: 0
      fraction: {N: 0.25, P2O5: 1.00, K2O: 1.00}
    - stage: development        # squaring, ~45 DAS
      day: 45
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}
    - stage: mid                # peak flowering, ~75 DAS
      day: 75
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}
    - stage: mid                # boll development, ~105 DAS
      day: 105
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}

  attainable_yield_t_ha:
    rainfed: 1.5
    irrigated: 2.5

  # [ICAR] 120:60:60 for irrigated Bt hybrid cotton. [REVIEW]
  reference_dose_kg_ha:
    N: 120
    P2O5: 60
    K2O: 60
    at_yield_t_ha: 2.5

  fertility_adjustment:
    low: 1.25
    medium: 1.00
    high: 0.75

  cross_check_tolerance: 0.60

soil_fertility_classes:
  available_N_kg_ha:
    low: [0, 280]
    medium: [280, 560]
    high: [560, 2000]
  available_P2O5_kg_ha:
    low: [0, 10]
    medium: [10, 25]
    high: [25, 200]
  available_K2O_kg_ha:
    low: [0, 108]
    medium: [108, 280]
    high: [280, 1000]

mineralisation_fraction: 0.02

limits:
  # Cotton tolerates alkaline and mildly saline soils better than the cereals,
  # which is why it dominates the black-soil tracts of central and western India.
  ph:
    optimal: [6.0, 8.0]
    tolerable: [5.5, 8.5]

  temperature_c:
    optimal: [21.0, 32.0]
    heat_stress_above: 38.0      # boll shedding
    cold_stress_below: 15.0
    heat_stress_critical_stage: mid

  waterlogging_tolerance_days: 2
