# =============================================================================
# Wheat — agronomic reference data
# =============================================================================
# PURPOSE
#   Replaces the dataset-derived quartiles previously used by src/advisor.py.
#   Those quartiles came from a synthetic Kaggle dataset (2200 rows, exactly 100
#   per crop -> generated, not observed), so the "ideal ranges" they produced were
#   statistical artifacts rather than agronomic facts.
#
# SOURCING RULE
#   Every numeric value below carries a source tag. No value is invented, and no
#   value is derived from the training dataset.
#     [FAO56]  FAO Irrigation & Drainage Paper 56, Allen et al. (1998)
#     [SHC]    Soil Health Card fertility classes (Govt. of India standard)
#     [ICAR]   ICAR / state agri-university package of practices
#     [REVIEW] plausible working value, NOT yet cross-checked -> see caveat below
#
# CAVEAT — READ BEFORE TRUSTING DOSAGES
#   Values tagged [REVIEW] are working defaults chosen from published ranges but
#   not verified against a primary source in-session (network tools were down).
#   They must be confirmed by an agronomist or against the cited literature before
#   this tool's output is acted on in a real field. Nutrient uptake and use
#   efficiency in particular vary widely with variety, soil, and management.
# =============================================================================

crop: wheat
display_name:
  en: Wheat
  hi: गेहूँ
category: cereal
season: rabi                    # Nov-Dec sowing, Mar-Apr harvest (North India)

# -----------------------------------------------------------------------------
# WATER — FAO-56 single crop coefficient method
# -----------------------------------------------------------------------------
water:
  # Crop coefficient by stage. ETc = ETo * Kc
  # [FAO56] Table 12. Kc_end 0.25 (harvested dry) .. 0.4 (high grain moisture);
  # 0.35 chosen as a mid value for mechanised harvest at ~14% moisture. [REVIEW]
  kc:
    initial: 0.30
    mid: 1.15
    end: 0.35

  # Stage lengths in days from sowing. [FAO56] Table 11 lists 120-150 d total for
  # spring wheat; Indian rabi wheat is typically 120-145 d. Sum below = 125 d.
  # Variety- and sowing-date-dependent -> expose as an override in the UI. [REVIEW]
  stages:
    - name: initial          # sowing -> CRI (crown root initiation, ~21 DAS)
      days: 20
      kc: 0.30
    - name: development      # tillering
      days: 30
      kc: null               # linearly interpolated initial -> mid
    - name: mid              # jointing, booting, flowering, grain fill
      days: 50
      kc: 1.15
    - name: late             # ripening / senescence
      days: 25
      kc: null               # linearly interpolated mid -> end

  # Effective rooting depth, metres. [FAO56] Table 22: spring wheat 1.0-1.5 m.
  # 1.10 m max is a conservative value for Indian rabi wheat on medium soils.
  root_depth_m:
    initial: 0.15            # at emergence
    max: 1.10

  # Soil water depletion fraction for no stress (p). RAW = p * TAW.
  # [FAO56] Table 22 gives p = 0.55 for wheat.
  depletion_fraction_p: 0.55

  # Yield response factor. [FAO56] / FAO-33. Used to flag yield loss under
  # sustained water stress; not used to size irrigation.
  yield_response_ky: 1.05

  # Fraction of applied water reaching the root zone. [FAO56] Ch. 8 ranges. [REVIEW]
  application_efficiency:
    surface: 0.60            # flood / border / check-basin
    sprinkler: 0.75
    drip: 0.90

  # Stages at which water stress is most damaging -> raise alert priority.
  # [ICAR] CRI and flowering are the two critical irrigations for wheat. [REVIEW]
  critical_stages: [initial, mid]

# -----------------------------------------------------------------------------
# NUTRIENTS — budget method
# -----------------------------------------------------------------------------
# dose = (target_yield * uptake_per_tonne - soil_credit) / use_efficiency
#
# uptake_per_tonne is TOTAL crop uptake (grain + straw) per tonne of GRAIN yield.
# Reported ranges: N 25-30, P2O5 10-12, K2O 25-35 kg per tonne grain. Mid values
# taken below. [ICAR] [REVIEW]
nutrients:
  uptake_per_tonne_grain:
    N: 26.0                  # kg N per tonne grain
    P2O5: 11.0
    K2O: 30.0

  # First-season recovery of applied nutrient. These strongly affect the final
  # dose, so they are the most important values to verify. [ICAR] [REVIEW]
  use_efficiency:
    N: 0.45                  # split-applied urea; broadcast-only is lower (~0.35)
    P2O5: 0.20               # low first-season recovery is normal for P
    K2O: 0.60

  # Fraction of the season's dose applied at each stage. Must sum to 1.0 per
  # nutrient — enforced by a unit test. P and K fully basal is standard for wheat.
  # [ICAR] N split 50 basal / 25 CRI / 25 tillering. [REVIEW]
  splits:
    - stage: basal           # at sowing
      day: 0
      fraction: {N: 0.50, P2O5: 1.00, K2O: 1.00}
    - stage: initial         # first irrigation, CRI ~21 DAS
      day: 21
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}
    - stage: development     # tillering ~45 DAS
      day: 45
      fraction: {N: 0.25, P2O5: 0.0, K2O: 0.0}

  # Attainable grain yield, t/ha. Used as the default target when the yield model
  # is unavailable. Indian national average ~3.5 t/ha; well-managed irrigated
  # rabi wheat reaches 5.0-5.5 t/ha. [ICAR] [REVIEW]
  attainable_yield_t_ha:
    rainfed: 2.5
    irrigated: 5.0

  # Reference NPK recommendation for a fully irrigated crop. This is the PRIMARY
  # basis for the dose we actually recommend — see note below.
  # [ICAR] 120:60:40 N:P2O5:K2O kg/ha is the standard irrigated-wheat package.
  reference_dose_kg_ha:
    N: 120
    P2O5: 60
    K2O: 40
    at_yield_t_ha: 5.0

  # WHY THE REFERENCE DOSE LEADS, AND THE UPTAKE BUDGET ONLY CROSS-CHECKS
  #   A from-scratch uptake budget for wheat gives
  #     (5 t/ha x 26 kg N/t - ~21 kg soil credit) / 0.45 NUE ~= 242 kg N/ha,
  #   roughly double the validated 120 kg/ha package. Reconciling backwards,
  #   130 = soil_supply + 120 x 0.45 implies the soil supplies ~76 kg N/ha —
  #   far more than 2% mineralisation of the topsoil yields. The mechanistic
  #   budget carries too many uncertain parameters (NUE, mineralisation rate,
  #   effective soil depth) to size a dose on its own.
  #
  #   So we follow the method Soil Health Card and Nutrient Expert use: scale a
  #   field-validated reference dose by yield target and soil fertility class.
  #   The uptake budget is still computed and shown as a sanity cross-check, and
  #   a large divergence between the two is surfaced rather than hidden.
  #
  #     dose = reference_dose x (target_yield / reference_yield) x fertility_factor
  #
  # Multiplier applied per nutrient according to the soil test fertility class.
  # [SHC] Standard practice: raise ~25% on low-testing soils, cut ~25% on high.
  # [REVIEW]
  fertility_adjustment:
    low: 1.25
    medium: 1.00
    high: 0.75

  # Warn if the mechanistic uptake budget and the scaled reference dose diverge
  # by more than this ratio — a signal that one of the two is misparameterised.
  cross_check_tolerance: 0.60

# -----------------------------------------------------------------------------
# SOIL FERTILITY CLASSES — for crediting soil supply
# -----------------------------------------------------------------------------
# Standard Indian Soil Health Card classes for available nutrients, kg/ha. [SHC]
# NOTE: SoilGrids provides TOTAL N only (not plant-available), and provides no
# available P or K at all. So:
#   - N  : estimated from SoilGrids total N via mineralisation_fraction below
#   - P,K: fall back to the "medium" class unless the user supplies a soil test
# The UI MUST badge these as estimated rather than measured.
soil_fertility_classes:
  available_N_kg_ha:
    low: [0, 280]
    medium: [280, 560]
    high: [560, 2000]
  available_P2O5_kg_ha:      # Olsen-P basis
    low: [0, 10]
    medium: [10, 25]
    high: [25, 200]
  available_K2O_kg_ha:
    low: [0, 108]
    medium: [108, 280]
    high: [280, 1000]

# Fraction of soil total N mineralised and available to the crop in one season.
# Literature range ~1-3%/season in temperate/subtropical soils. 2% taken.
# This is an ESTIMATE and the dominant uncertainty in the N credit. [REVIEW]
mineralisation_fraction: 0.02

# -----------------------------------------------------------------------------
# AGRONOMIC LIMITS — for stress alerts (NOT for dosing)
# -----------------------------------------------------------------------------
limits:
  # [ICAR] wheat tolerates 6.0-7.5 well; yield declines outside 5.5-8.0. [REVIEW]
  ph:
    optimal: [6.0, 7.5]
    tolerable: [5.5, 8.0]

  # Daily mean air temperature, degC. Heat stress during grain fill is the main
  # yield risk for Indian wheat (terminal heat). [ICAR] [REVIEW]
  temperature_c:
    optimal: [15.0, 25.0]
    heat_stress_above: 32.0        # sustained -> grain-fill loss
    cold_stress_below: 4.0         # frost risk at flowering
    heat_stress_critical_stage: mid

  # Waterlogging tolerance: wheat is sensitive. Days of saturation before damage.
  waterlogging_tolerance_days: 2   # [REVIEW]
